name: C++ CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                compiler: [g++-14, clang++-18]
                sanitizers: [OFF, ON]

        steps:
            - uses: actions/checkout@v4

            - name: install
              run: sudo apt update && sudo apt install -y ninja-build clang-18 libclang-rt-18-dev libc++-18-dev libc++abi-18-dev libunwind-18-dev

            - name: cmake
              run: >
                  cmake -S . -B build -G Ninja
                  -DCMAKE_BUILD_TYPE=Debug
                  -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
                  -DCMAKE_CXX_FLAGS="${{ startsWith(matrix.compiler, 'clang') && '-stdlib=libc++' || '' }}"
                  -DENABLE_WERROR=ON
                  -DENABLE_SANITIZERS=${{ matrix.sanitizers }}
                  -DUSE_CCACHE=OFF

            - name: build
              run: cmake --build build

            - name: test
              run: ctest --test-dir build --output-on-failure
